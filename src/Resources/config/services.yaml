services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyAiConversation\:
        resource: '../../{Controller,EventListener,Form,Repository,Service,Twig}'

    Wexample\SymfonyAiConversation\Api\Controller\:
        resource: '../../Api/Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyAiConversation\Api\Normalizer\:
        resource: '../../Api/Normalizer/*'
        tags: ['serializer.normalizer']
