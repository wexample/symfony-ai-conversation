items:
  - name: ClaudeConversationSession
    type: class
    extends: ConversationSession
    description: "A conversation held by Claude, projected from its record file.\nThe transcript belongs to the engine and stays out — `sdkId` is the thread\nback to it. Like an agent, the record is named by its own identity —\n`<uuid>.yml` — so the row takes that uuid and a file that is gone leaves no\nrow behind."
    properties:
      - name: agent
        type: Wexample\SymfonyAiConversation\Entity\ConversationAgent
        nullable: true
        default: null
      - name: agentName
        type: string
      - name: name
        type: string
        nullable: true
        default: null
      - name: model
        type: Wexample\SymfonyAiConversation\Entity\ConversationModel
        nullable: true
        default: null
      - name: turnCount
        type: int
        default: 0
      - name: dateCreated
        type: DateTimeInterface
        nullable: true
        default: null
      - name: dateLastMessage
        type: DateTimeInterface
        nullable: true
        default: null
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: path
        type: string
      - name: sdkId
        type: string
        nullable: true
        default: null
    methods:
      - type: method
        name: getAgent
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationAgent
      - type: method
        name: setAgent
        parameters:
          - type: Wexample\SymfonyAiConversation\Entity\ConversationAgent
            name: agent
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getAgentName
        return:
          type: string
      - type: method
        name: setAgentName
        parameters:
          - type: string
            name: agentName
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getName
        return:
          type: string
      - type: method
        name: setName
        parameters:
          - type: string
            name: name
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getModel
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationModel
      - type: method
        name: setModel
        parameters:
          - type: Wexample\SymfonyAiConversation\Entity\ConversationModel
            name: model
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getTurnCount
        return:
          type: int
      - type: method
        name: setTurnCount
        parameters:
          - type: int
            name: turnCount
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getDateCreated
        return:
          type: DateTimeInterface
      - type: method
        name: setDateCreated
        parameters:
          - type: DateTimeInterface
            name: dateCreated
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: getDateLastMessage
        return:
          type: DateTimeInterface
      - type: method
        name: setDateLastMessage
        parameters:
          - type: DateTimeInterface
            name: dateLastMessage
        return:
          type: Wexample\SymfonyAiConversation\Entity\ConversationSession
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: __construct
        parameters:
          - type: string
            name: path
      - type: method
        name: idFor
        description: 'The identity the record is named by, read straight off the file name.'
        parameters:
          - type: string
            name: path
        return:
          type: Uuid
      - type: method
        name: getPath
        return:
          type: string
      - type: method
        name: getSdkId
        return:
          type: string
      - type: method
        name: setSdkId
        parameters:
          - type: string
            name: sdkId
        return:
          type: self
